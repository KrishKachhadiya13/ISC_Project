[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegaguard-backend"
version = "0.1.0"
description = "StegaGuard: AI-Based Image Steganalysis with Cryptographic Verification"
authors = [{ name = "StegaGuard Team" }]
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "data",
    "models",
    "results",
    "dist",
    "build",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.steganalysis.*",
]
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "skimage.*",
    "sklearn.*",
    "joblib.*",
    "slowapi.*",
    "torch.*",
    "torchvision.*",
    "PIL.*",
    "hypothesis.*",
    "pystc.*",
]
ignore_missing_imports = true
